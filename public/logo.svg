<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" fill="none">
  <defs>
    <linearGradient id="dq-primary-full" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="dq-pulse-full" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="dq-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="dq-glow-full" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- SYMBOL (Scaled and positioned on left) -->
  <g transform="translate(5, 5) scale(0.8)">
    <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#dq-primary-full)" opacity="0.08" />
    <path d="M 72 44 A 28 28 0 1 0 63.8 63.8" stroke="url(#dq-primary-full)" stroke-width="7.5" stroke-linecap="round" fill="none" />
    <path d="M 52 52 L 82 82" stroke="url(#dq-primary-full)" stroke-width="8.5" stroke-linecap="round" />
    <path d="M 24 44 L 33 44 L 39 28 L 47 62 L 55 36 L 61 44 L 68 44" stroke="url(#dq-pulse-full)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#dq-glow-full)" />
    <circle cx="39" cy="28" r="2.5" fill="#10B981" />
    <circle cx="82" cy="82" r="3.5" fill="#06B6D4" filter="url(#dq-glow-full)" />
  </g>

  <!-- TYPOGRAPHY -->
  <g font-family="system-ui, -apple-system, 'Inter', 'Outfit', sans-serif">
    <!-- Brand Name -->
    <text x="96" y="55" font-size="42" font-weight="800" fill="#0F172A" letter-spacing="-1px">Diagnosti</text>
    <text x="282" y="55" font-size="42" font-weight="900" fill="url(#dq-text-grad)" letter-spacing="-0.5px">Q</text>
    
    <!-- Tagline -->
    <text x="98" y="74" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="3.2px">LABORATORIO CLÍNICO &amp; DIAGNÓSTICO DIGITAL</text>
  </g>
</svg>
